<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Logotipo oficial El Patatón Algeciras desde 2005">
  <!-- Fondo circular blanco y aro exterior negro -->
  <circle cx="100" cy="100" r="93" fill="#FFFFFF" stroke="#151210" stroke-width="7.5" />

  <!-- Silueta del horno tradicional asador de patatas -->
  <g fill="#151210">
    <!-- Chimenea superior -->
    <rect x="95" y="38" width="10" height="11" />
    <!-- Cuerpo del horno con hombros inclinados -->
    <polygon points="95,48 105,48 119,57 119,99 81,99 81,57" />
  </g>

  <!-- Ventana superior y los 3 cajones del horno -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="92.5" y="54" width="15" height="8" />
    <rect x="85.5" y="68" width="29" height="6.8" />
    <line x1="93" y1="71.4" x2="107" y2="71.4" stroke-width="1.3" />
    <rect x="85.5" y="78" width="29" height="6.8" />
    <line x1="93" y1="81.4" x2="107" y2="81.4" stroke-width="1.3" />
    <rect x="85.5" y="88" width="29" height="6.8" />
    <line x1="93" y1="91.4" x2="107" y2="91.4" stroke-width="1.3" />
  </g>

  <!-- Tipografía condensada EL PATATÓN -->
  <text
    x="100"
    y="130"
    text-anchor="middle"
    fill="#151210"
    font-family="'Oswald', 'Arial Narrow', 'Plus Jakarta Sans', sans-serif"
    font-weight="700"
    font-size="25.5"
    letter-spacing="2"
    transform="scale(0.88, 1.12) translate(13.5, -13)">
    EL PATATÓN
  </text>

  <!-- Leyenda histórica oficial: desde 2005 -->
  <text
    x="100"
    y="153"
    text-anchor="middle"
    fill="#151210"
    font-family="'Fraunces', Georgia, serif"
    font-style="italic"
    font-weight="900"
    font-size="11.5"
    letter-spacing="0.4">
    desde 2005
  </text>
</svg>
