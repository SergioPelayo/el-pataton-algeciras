<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#121412" />
  <title>Esta patata se ha quedado en el horno · El Patatón Algeciras</title>
  <style>
    :root {
      --bg-paper: #FFFFFF;
      --ink: #121412;
      --ink-muted: #4A514B;
      --accent-paprika: #1E7B3C;
      --accent-butter: #6CC24A;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
      background: var(--bg-paper);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .card {
      max-width: 30rem;
      background: #FFFFFF;
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--accent-paprika);
      padding: 2rem 1.5rem;
    }
    .oven { width: 84px; height: 84px; margin: 0 auto 1.1rem; display: block; }
    .code { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--ink-muted); letter-spacing: 0.08em; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.15; margin: 0.4rem 0 0.75rem; }
    p { color: var(--ink-muted); line-height: 1.55; margin-bottom: 1.4rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.65rem; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.1rem;
      border: 2px solid var(--ink);
      font-weight: 700;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .btn--primary { background: var(--accent-paprika); color: #FFFFFF; }
    .btn--butter { background: var(--accent-butter); }
  </style>
</head>
<body>
  <main class="card">
    <svg class="oven" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29.5" fill="#FFFFFF" stroke="#121412" stroke-width="4"/>
      <g transform="translate(32 32) scale(0.66) translate(-100 -76)">
        <rect x="95.5" y="46" width="9" height="11" fill="#121412"/>
        <polygon points="95.5,56 104.5,56 118,64 118,106 82,106 82,64" fill="#121412"/>
        <rect x="92.5" y="62" width="15" height="8" fill="#6CC24A"/>
        <rect x="85.5" y="76" width="29" height="6.8" fill="#1E7B3C"/>
        <rect x="85.5" y="86" width="29" height="6.8" fill="#6CC24A"/>
        <rect x="85.5" y="96" width="29" height="6.8" fill="#1E7B3C"/>
      </g>
    </svg>
    <div class="code">ERROR 404 · CAJÓN VACÍO</div>
    <h1>Esta patata se ha quedado en el horno</h1>
    <p>La página que buscas no existe o se ha movido. La carta completa sigue donde siempre.</p>
    <div class="actions">
      <a class="btn btn--primary" id="home-link" href="/">Volver a la carta</a>
      <a class="btn btn--butter" href="tel:956658122">Llamar · 956 65 81 22</a>
    </div>
  </main>
  <script>
    // En GitHub Pages la web cuelga de /el-pataton-algeciras/
    if (location.pathname.indexOf('/el-pataton-algeciras/') === 0) {
      document.getElementById('home-link').setAttribute('href', '/el-pataton-algeciras/');
    }
  </script>
</body>
</html>
